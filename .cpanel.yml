---
deployment:
  tasks:
    # 1. Copy files to target destination
    - export DEPLOYPATH=/home/$USER/public_html/planner.kaldisbunnaet.com
    - /bin/cp -R . $DEPLOYPATH

    # 2. Install PHP Composer dependencies
    - cd $DEPLOYPATH && (composer install --no-dev --optimize-autoloader || /usr/local/bin/composer install --no-dev --optimize-autoloader || true)

    # 3. Optional frontend build if node/npm are present (assets already pre-built in repo)
    - cd $DEPLOYPATH && (npm run build || /usr/local/bin/npm run build || true)

    # 4. Laravel optimizations
    - cd $DEPLOYPATH && (php artisan storage:link || true)
    - cd $DEPLOYPATH && (php artisan view:clear || true)
    - cd $DEPLOYPATH && (php artisan config:cache || true)
    - cd $DEPLOYPATH && (php artisan route:cache || true)

    # 5. Database migrations
    - cd $DEPLOYPATH && (php artisan migrate --force || true)

